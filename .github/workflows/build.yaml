# FilePath    : .github/workflows/build.yaml
# Author      : jiaopengzi
# Blog        : https://jiaopengzi.com
# Description : 构建并发布 Power BI Custom Sample Data (原生 Go + Fyne) 的 Windows 桌面产物.

name: Build Power BI Custom Sample Data

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to release, optional when manually triggering."
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Go version from go.mod
        id: read_go
        shell: pwsh
        run: |
          $match = Select-String -Path go.mod -Pattern '^go\s+(.+)$' | Select-Object -First 1
          if ($null -eq $match) { $goVersion = '1.27.1' } else { $goVersion = $match.Matches[0].Groups[1].Value }
          "GOV=$goVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOV }}

      - name: Verify C toolchain (CGO for Fyne)
        shell: pwsh
        run: gcc --version

      - name: Install build tools (fyne CLI + golangci-lint)
        shell: pwsh
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run shared build script (CI pipeline)
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: .\run.ps1 -Choice 1

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF.Substring(10)
          } elseif (-not [string]::IsNullOrWhiteSpace('${{ github.event.inputs.release_tag }}')) {
            $tag = '${{ github.event.inputs.release_tag }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }

          $safeTag = $tag -replace '[\\/:*?"<>|\s]+', '-'
          Compress-Archive -Path .\build\bin\* -DestinationPath ".\dist\${safeTag}-windows.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-bi-custom-sample-data-windows
          path: dist/*.zip

      - name: Create release and upload assets
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
