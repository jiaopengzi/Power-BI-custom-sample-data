# FilePath    : .github/workflows/build.yaml
# Author      : jiaopengzi
# Blog        : https://jiaopengzi.com
# Description : 构建并发布 Power BI Custom Sample Data (原生 Go + Fyne) 的 Windows 桌面产物.

name: Build Power BI Custom Sample Data

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to release, optional when manually triggering."
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Go version from go.mod
        id: read_go
        shell: pwsh
        run: |
          $match = Select-String -Path go.mod -Pattern '^go\s+(.+)$' | Select-Object -First 1
          if ($null -eq $match) { $goVersion = '1.27.1' } else { $goVersion = $match.Matches[0].Groups[1].Value }
          "GOV=$goVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOV }}

      - name: Verify C toolchain (CGO for Fyne)
        shell: pwsh
        run: gcc --version

      - name: Install build tools (fyne CLI + golangci-lint)
        shell: pwsh
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run shared build script (CI pipeline)
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: .\run.ps1 -Choice 1

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF.Substring(10)
          } elseif (-not [string]::IsNullOrWhiteSpace('${{ github.event.inputs.release_tag }}')) {
            $tag = '${{ github.event.inputs.release_tag }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }

          $safeTag = $tag -replace '[\\/:*?"<>|\s]+', '-'
          Compress-Archive -Path .\build\bin\* -DestinationPath ".\dist\${safeTag}-windows.zip" -Force

      # 发版说明: 优先提取 CHANGELOG.md 中当前 tag 的章节; 提取不到时用默认文案兜底
      # (Gitee 同步要求 Release 描述非空, 见 sync_gitee.yaml)
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF.Substring(10)
          } elseif (-not [string]::IsNullOrWhiteSpace('${{ github.event.inputs.release_tag }}')) {
            $tag = '${{ github.event.inputs.release_tag }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }

          $lines = Get-Content -Path CHANGELOG.md -Encoding UTF8
          # 用 [tag] 带右括号精确匹配, 避免 v0.1.0-rc 误匹配 v0.1.0-rc1 章节
          $marker = "[$($tag)]"
          $capturing = $false
          $section = @()
          foreach ($line in $lines) {
            if ($line -match '^##\s') {
              if ($capturing) { break }
              if ($line.Contains($marker)) { $capturing = $true }
            }
            if ($capturing) { $section += $line }
          }

          if ($section.Count -gt 0) {
            $notes = $section -join "`n"
            Write-Host "release notes extracted for $tag ($($section.Count) lines)"
          } else {
            $notes = "- 如何使用，请参考 [README.md](./README.md)`n- 更新内容，请参考 [CHANGELOG.md](./CHANGELOG.md)"
            Write-Host "CHANGELOG.md has no section for $tag, using default notes"
          }
          $notes | Out-File -FilePath .\dist\release-notes.md -Encoding utf8 -NoNewline

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-bi-custom-sample-data-windows
          path: dist/*.zip

      - name: Create release and upload assets
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: dist/release-notes.md
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
